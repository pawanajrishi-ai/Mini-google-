<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Google 1998 · 3D Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #0a0a15 80%);
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1500px;
            overflow-x: hidden;
        }

        /* ---- floating stars background ---- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 45% 75%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.2px 1.2px at 70% 55%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 92% 45%, rgba(255,255,255,0.3), transparent);
            background-size: 220px 220px;
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
            animation: drift 80s linear infinite;
        }
        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-60px, -60px); }
        }

        /* ---- main 3D card ---- */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            width: 100%;
            background: rgba(22, 22, 35, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(255, 215, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 30px 35px 35px;
            transform: rotateX(2deg) rotateY(-1deg);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }
        .container:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        /* subtle 3D tilt via JS */
        .container {
            --rx: 2deg;
            --ry: -1deg;
            transform: rotateX(var(--rx)) rotateY(var(--ry));
        }

        /* ---- header ---- */
        h1 {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: -1.5px;
            text-align: center;
            color: #f5e6c8;
            text-shadow:
                0 2px 0 #8a6d2b,
                0 4px 10px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 215, 0, 0.25);
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 4px;
            transform: translateZ(30px);
        }
        .subhead {
            text-align: center;
            font-size: 0.95rem;
            color: #b8a88a;
            letter-spacing: 1px;
            font-style: italic;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.2);
            padding-bottom: 14px;
            margin-bottom: 28px;
            transform: translateZ(20px);
        }

        /* ---- search bar ---- */
        .search-area {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
            flex-wrap: wrap;
            transform: translateZ(25px);
        }
        .search-area input {
            flex: 2;
            min-width: 240px;
            padding: 14px 18px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            background: rgba(10, 10, 20, 0.75);
            color: #f0e6d2;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            outline: none;
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.7),
                0 2px 12px rgba(0, 0, 0, 0.4);
            transition: border 0.2s, box-shadow 0.2s;
        }
        .search-area input:focus {
            border-color: #f5d76e;
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(255, 215, 0, 0.25);
        }
        .search-area input::placeholder {
            color: #7a7060;
        }
        .search-area button {
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: linear-gradient(145deg, #3b352a, #242018);
            color: #f5e6c8;
            font-family: 'Times New Roman', Times, serif;
            cursor: pointer;
            box-shadow:
                0 6px 0 #0f0e0a,
                0 8px 18px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 215, 0, 0.15);
            transition: transform 0.1s, box-shadow 0.1s;
            transform: translateY(-2px);
        }
        .search-area button:hover {
            background: linear-gradient(145deg, #4a4234, #2c261e);
            box-shadow:
                0 4px 0 #0f0e0a,
                0 6px 14px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 215, 0, 0.25);
            transform: translateY(0px);
        }
        .search-area button:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #0f0e0a,
                0 3px 8px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 215, 0, 0.2);
        }

        /* ---- rankings columns ---- */
        .rankings {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-top: 8px;
            transform-style: preserve-3d;
        }
        .column {
            flex: 1 1 300px;
            background: rgba(18, 18, 30, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 16px;
            padding: 18px 20px 22px;
            backdrop-filter: blur(4px);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out, box-shadow 0.2s;
            will-change: transform;
        }
        .column:hover {
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 215, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* each column gets a subtle 3D pop via JS */

        .column h2 {
            font-size: 1.55rem;
            margin-bottom: 2px;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.25);
            color: #f0e6d2;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            transform: translateZ(15px);
        }
        .column .note {
            font-size: 0.78rem;
            color: #9a8d76;
            margin-top: 2px;
            margin-bottom: 16px;
            font-style: italic;
            letter-spacing: 0.2px;
            transform: translateZ(10px);
        }

        /* ---- result list ---- */
        .result-list {
            list-style: none;
            padding: 0;
            margin: 0;
            transform-style: preserve-3d;
        }
        .result-item {
            margin-bottom: 16px;
            padding: 10px 12px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid rgba(255, 215, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            transform: translateZ(5px);
        }
        .result-item:hover {
            transform: translateZ(18px) scale(1.02);
            background: rgba(255, 215, 0, 0.04);
            border-left-color: rgba(255, 215, 0, 0.6);
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .page-title {
            font-size: 1.02rem;
            font-weight: bold;
            color: #7ec8e3;
            text-decoration: underline;
            text-decoration-color: rgba(126, 200, 227, 0.4);
            text-underline-offset: 2px;
            cursor: default;
            word-break: break-word;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }
        .page-url {
            font-size: 0.72rem;
            color: #6a9e7a;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-top: 2px;
            opacity: 0.9;
        }
        .page-score {
            font-size: 0.78rem;
            color: #f5d76e;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.08);
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            margin-top: 7px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.3px;
        }
        .empty-message {
            font-style: italic;
            color: #8a7e6a;
            padding: 12px 6px;
            text-align: center;
            font-size: 0.95rem;
        }

        /* ---- debug / footer ---- */
        .debug-info {
            font-size: 0.68rem;
            color: #6a6255;
            margin-top: 22px;
            font-family: 'Courier New', monospace;
            text-align: center;
            letter-spacing: 0.3px;
            transform: translateZ(8px);
            opacity: 0.8;
        }
        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.72rem;
            color: #5f574a;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            padding-top: 14px;
            letter-spacing: 0.5px;
            transform: translateZ(5px);
        }

        /* ---- responsive ---- */
        @media (max-width: 750px) {
            .container {
                padding: 20px 18px 25px;
                transform: rotateX(0deg) rotateY(0deg) !important;
            }
            h1 { font-size: 2.3rem; }
            .rankings { gap: 18px; }
            .search-area input { min-width: 160px; }
        }

        /* ---- highlight for query? not needed ---- */
    </style>
</head>
<body>

<!-- 3D container -->
<div class="container" id="mainContainer">
    <h1>Mini Google 1998</h1>
    <div class="subhead">old‑school keyword count &nbsp;vs.&nbsp; random surfer · 3D edition</div>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="e.g. google, page, web, surf" value="google" autofocus>
        <button id="searchBtn">Search</button>
    </div>

    <div class="rankings" id="rankings">
        <div class="column" id="oldColumn" data-tilt="old">
            <h2>Old way (1997)</h2>
            <div class="note">whole‑word count · case‑insensitive</div>
            <ul class="result-list" id="oldList"></ul>
        </div>
        <div class="column" id="surferColumn" data-tilt="surfer">
            <h2>Surfer way (1998)</h2>
            <div class="note">random surfer · teleport 0.15 · 5000 walks × 30 steps</div>
            <ul class="result-list" id="surferList"></ul>
        </div>
    </div>
    <div class="debug-info" id="debugInfo"></div>
    <div class="footer">📄 double‑click friendly · pure JS · data from 1998 lab · 3D tilt</div>
</div>

<!-- ============================================================ -->
<!--  DATA (redundant, but kept for clarity)                      -->
<!-- ============================================================ -->
<script type="text/plain" id="data-dump" style="display:none;">
    page,url,text,links_to
    1,http://www.google.com,"Google is the best search engine. Google helps you find web pages. Page rank is used by Google.",2;3;4
    2,http://www.yahoo.com,"Yahoo is a web portal and search engine. You can search the web. Yahoo has many links.",1;3;5
    3,http://www.altavista.com,"AltaVista was a popular search engine. It could search the web. AltaVista was fast.",1;2;4;5
    4,http://www.webcrawler.com,"WebCrawler is a search engine. It crawls the web. WebCrawler finds pages.",2;3
    5,http://www.lycos.com,"Lycos is a search engine and web portal. Lycos helps you surf the web. Surf the web with Lycos.",1;4
</script>

<script>
    // --------------------------------------------------------------
    //  DATA
    // --------------------------------------------------------------
    const pagesData = [
        { page: 1, url: "http://www.google.com", text: "Google is the best search engine. Google helps you find web pages. Page rank is used by Google.", links_to: "2;3;4" },
        { page: 2, url: "http://www.yahoo.com", text: "Yahoo is a web portal and search engine. You can search the web. Yahoo has many links.", links_to: "1;3;5" },
        { page: 3, url: "http://www.altavista.com", text: "AltaVista was a popular search engine. It could search the web. AltaVista was fast.", links_to: "1;2;4;5" },
        { page: 4, url: "http://www.webcrawler.com", text: "WebCrawler is a search engine. It crawls the web. WebCrawler finds pages.", links_to: "2;3" },
        { page: 5, url: "http://www.lycos.com", text: "Lycos is a search engine and web portal. Lycos helps you surf the web. Surf the web with Lycos.", links_to: "1;4" }
    ];

    const pages = {};
    pagesData.forEach(p => {
        pages[p.page] = {
            id: p.page,
            url: p.url,
            text: p.text,
            links: p.links_to.split(';').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n))
        };
    });
    const allPageIds = Object.keys(pages).map(Number);

    // --------------------------------------------------------------
    //  RANKING 1: Old way (whole word count)
    // --------------------------------------------------------------
    function oldWayRanking(query) {
        if (!query.trim()) return [];
        const q = query.trim().toLowerCase();
        const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b${escaped}\\b`, 'gi');

        const results = allPageIds.map(id => {
            const page = pages[id];
            const matches = page.text.match(regex);
            return {
                pageId: id,
                url: page.url,
                text: page.text,
                count: matches ? matches.length : 0
            };
        });
        results.sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return a.pageId - b.pageId;
        });
        return results;
    }

    // --------------------------------------------------------------
    //  RANKING 2: Surfer way (random surfer)
    // --------------------------------------------------------------
    function surferRanking() {
        const numWalks = 5000;
        const stepsPerWalk = 30;
        const teleportProb = 0.15;

        const visits = {};
        allPageIds.forEach(id => visits[id] = 0);

        const randomPage = () => allPageIds[Math.floor(Math.random() * allPageIds.length)];

        for (let w = 0; w < numWalks; w++) {
            let current = randomPage();
            visits[current] += 1;

            for (let s = 1; s < stepsPerWalk; s++) {
                if (Math.random() < teleportProb) {
                    current = randomPage();
                } else {
                    const outLinks = pages[current].links;
                    if (outLinks.length === 0) {
                        current = randomPage();
                    } else {
                        current = outLinks[Math.floor(Math.random() * outLinks.length)];
                    }
                }
                visits[current] += 1;
            }
        }

        const totalVisits = numWalks * stepsPerWalk;
        const results = allPageIds.map(id => {
            const page = pages[id];
            return {
                pageId: id,
                url: page.url,
                text: page.text,
                surferScore: visits[id] / totalVisits
            };
        });
        results.sort((a, b) => {
            if (b.surferScore !== a.surferScore) return b.surferScore - a.surferScore;
            return a.pageId - b.pageId;
        });
        return results;
    }

    // --------------------------------------------------------------
    //  RENDER
    // --------------------------------------------------------------
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderRankings(query) {
        const oldListEl = document.getElementById('oldList');
        const surferListEl = document.getElementById('surferList');
        const debugEl = document.getElementById('debugInfo');

        // ---- old way ----
        const oldResults = oldWayRanking(query);
        oldListEl.innerHTML = '';
        const nonZero = oldResults.filter(r => r.count > 0);
        if (nonZero.length === 0) {
            oldListEl.innerHTML = '<li class="empty-message">No pages contain that word.</li>';
        } else {
            nonZero.forEach(r => {
                const li = document.createElement('li');
                li.className = 'result-item';
                li.innerHTML = `
                    <div class="page-title">${escapeHtml(pages[r.pageId].url)}</div>
                    <div class="page-url">page ${r.pageId}</div>
                    <div class="page-score">🔍 ${r.count} whole‑word match${r.count !== 1 ? 'es' : ''}</div>
                `;
                oldListEl.appendChild(li);
            });
        }

        // ---- surfer way ----
        const surferResults = surferRanking();
        surferListEl.innerHTML = '';
        surferResults.forEach(r => {
            const li = document.createElement('li');
            li.className = 'result-item';
            const percent = (r.surferScore * 100).toFixed(2);
            li.innerHTML = `
                <div class="page-title">${escapeHtml(pages[r.pageId].url)}</div>
                <div class="page-url">page ${r.pageId}</div>
                <div class="page-score">🌊 surfer score: ${percent}%</div>
            `;
            surferListEl.appendChild(li);
        });

        debugEl.textContent = `⚡ surfer: 5,000 walks × 30 steps · teleport 0.15 · query: "${query}"`;
    }

    // --------------------------------------------------------------
    //  3D TILT EFFECTS
    // --------------------------------------------------------------
    function initTilt() {
        const container = document.getElementById('mainContainer');
        const columns = document.querySelectorAll('.column');

        // ---- main container subtle 3D tilt on mouse move ----
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -4; // range ~ -4..4 deg
            const rotateY = ((x - centerX) / centerX) * 4;
            container.style.setProperty('--rx', `${rotateX}deg`);
            container.style.setProperty('--ry', `${rotateY}deg`);
        });

        container.addEventListener('mouseleave', () => {
            container.style.setProperty('--rx', '2deg');
            container.style.setProperty('--ry', '-1deg');
        });

        // ---- column 3D tilt on hover (individual cards) ----
        columns.forEach(col => {
            col.addEventListener('mousemove', (e) => {
                const rect = col.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -6;
                const rotateY = ((x - centerX) / centerX) * 6;
                col.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
            });
            col.addEventListener('mouseleave', () => {
                col.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            });
        });

        // ---- result items float up on hover (already CSS, but add extra 3D pop) ----
        // (handled purely via CSS hover translateZ)
    }

    // --------------------------------------------------------------
    //  INIT
    // --------------------------------------------------------------
    window.addEventListener('load', () => {
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('searchBtn');

        // initial search
        input.value = 'google';
        renderRankings('google');

        // events
        btn.addEventListener('click', () => renderRankings(input.value));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') renderRankings(input.value);
        });

        // activate 3D tilt
        initTilt();
    });
</script>
</body>
</html>
